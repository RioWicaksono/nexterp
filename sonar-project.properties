sonar.organization=nexterp
sonar.projectKey=nexterp-erp

# Backend (.NET)
sonar.cs.opencover.reportsPaths=coverage/*.opencover.xml
sonar.coverage.exclusions=**/*.g.cs,**/obj/**,**/bin/**

# Frontend (Next.js)
sonar.typescript.lcov.reportPaths=ERP.WebUI/coverage/lcov.info
sonar.sources=ERP.WebUI/src
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Additional exclusions
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.stories.tsx,**/*.d.ts
