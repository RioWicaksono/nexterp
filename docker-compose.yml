# NEXTERP ERP - Development Environment
# Usage: docker-compose up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: nexterp-db-dev
    environment:
      POSTGRES_USER: nexterp
      POSTGRES_PASSWORD: nexterp_dev_password
      POSTGRES_DB: nexterp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexterp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexterp-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexterp-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexterp-network

  # Backend API (.NET)
  api:
    build:
      context: .
      dockerfile: ERP.API/Dockerfile
    container_name: nexterp-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=nexterp_dev;Username=nexterp;Password=nexterp_dev_password"
      Redis__ConnectionString: "redis:6379"
      Jwt__SecretKey: "${JWT_SECRET_KEY:-NexterpDevSecretKey2024!MinimumLength32Chars}"
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
      DEMO_PASSWORD: "DevPassword2024!"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ERP.API:/app
      - ./ERP.Application:/app/../ERP.Application
      - ./ERP.Domain:/app/../ERP.Domain
      - ./ERP.Infrastructure:/app/../ERP.Infrastructure
    networks:
      - nexterp-network

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: nextjs-frontend/Dockerfile
    container_name: nexterp-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./nextjs-frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - nexterp-network

  # pgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexterp-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexterp.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - nexterp-network
    restart: unless-stopped

  # Redis Commander (Redis Management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nexterp-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - nexterp-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  nexterp-network:
    driver: bridge
