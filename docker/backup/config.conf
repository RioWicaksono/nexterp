# ============================================================
# NEXTERP ERP - Production Backup Configuration
# ============================================================

# Backup Schedule (Cron format)
# Default: Daily at 2:00 AM
BACKUP_SCHEDULE="0 2 * * *"

# Retention Policy
BACKUP_RETENTION_DAYS=30

# Backup Directory
BACKUP_DIR=./docker/backup/postgres

# Backup Compression (0-9)
BACKUP_COMPRESSION_LEVEL=9

# Include/exclude options for pg_dump
# Default includes all tables
# BACKUP_TABLES="public.*"
# BACKUP_EXCLUDE_TABLES="*.logs"

# Verification after backup
VERIFY_BACKUP=true
